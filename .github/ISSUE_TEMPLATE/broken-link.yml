name: 🔗 Broken Link / Stale Resource
description: Report a broken link or out-of-date entry
title: "[Broken]: "
labels: ["broken-link", "needs-review"]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Old URL
    validations:
      required: true

  - type: input
    id: new_url
    attributes:
      label: New URL (if available)

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - URL returns 404 / DNS failure
        - URL redirects elsewhere
        - Project is archived / discontinued
        - Description is no longer accurate
        - Maintenance status has changed
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
